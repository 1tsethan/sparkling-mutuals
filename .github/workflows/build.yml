name: build
on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  ship-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test local shipping automation without GitHub writes
        shell: pwsh
        run: ./scripts/tests/Ship.Tests.ps1
      - name: Test Standard release asset selection
        run: python3 -m unittest discover -s scripts -p test_publish_standard.py
  sync-backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/cloudflare-sync
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/cloudflare-sync/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
  build-logic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew -p buildSrc test
  target:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.1.2", "26.2", "26.3"]
        edition: [standard, full, noauto]
        include:
          - edition: standard
            suffix: ''
          - edition: full
            suffix: -full
          - edition: noauto
            suffix: -noauto
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Test, build and verify target
        run: ./gradlew :${{ matrix.minecraft }}${{ matrix.suffix }}:verifyTargetJar
      - uses: actions/upload-artifact@v7
        with:
          name: jar-mc${{ matrix.minecraft }}-${{ matrix.edition }}
          path: versions/${{ matrix.minecraft }}${{ matrix.suffix }}/build/libs/sparkling-mutuals-*+mc${{ matrix.minecraft }}.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-mc${{ matrix.minecraft }}-${{ matrix.edition }}
          path: versions/${{ matrix.minecraft }}${{ matrix.suffix }}/build/test-results/test/TEST-*.xml
          if-no-files-found: error
  verify-all-targets:
    needs: [build-logic, target]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: jar-mc*
          path: incoming
          merge-multiple: true
      - run: chmod +x gradlew
      - run: ./gradlew verifyDistributions -PdistributionDir=incoming
  windows-updater:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - run: .\gradlew.bat :26.1.2-full:test --tests '*UpdateInstallTest'
        env:
          JAVA_TOOL_OPTIONS: -Djunit.jupiter.tempdir.cleanup.mode.default=NEVER
  build:
    if: always()
    needs: [ship-script, sync-backend, build-logic, target, verify-all-targets, windows-updater]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable build and verification job to pass
        env:
          BUILD_LOGIC_RESULT: ${{ needs.build-logic.result }}
          TARGET_RESULT: ${{ needs.target.result }}
          DISTRIBUTION_RESULT: ${{ needs.verify-all-targets.result }}
          SYNC_BACKEND_RESULT: ${{ needs.sync-backend.result }}
          SHIP_SCRIPT_RESULT: ${{ needs.ship-script.result }}
          WINDOWS_UPDATER_RESULT: ${{ needs.windows-updater.result }}
        run: |
          test "$BUILD_LOGIC_RESULT" = success
          test "$TARGET_RESULT" = success
          test "$DISTRIBUTION_RESULT" = success
          test "$SYNC_BACKEND_RESULT" = success
          test "$SHIP_SCRIPT_RESULT" = success
          test "$WINDOWS_UPDATER_RESULT" = success
